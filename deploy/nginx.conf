# PNK Astro Bot — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/pnkastro-bot
# Enable:   ln -s /etc/nginx/sites-available/pnkastro-bot /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;          # replace with your domain or IP if needed

    # ── /chat — AI endpoint, rate-limited ──────────────────────────────────
    location /chat {
        # Allow max 10 requests/minute per IP, burst 3 without delay
        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Longer timeout for LLM responses
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # CORS for browser clients
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── /health — status check ─────────────────────────────────────────────
    location /health {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 10s;
    }

    # ── Block everything else ───────────────────────────────────────────────
    location / {
        return 404;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options       "DENY"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-XSS-Protection      "1; mode=block"   always;

    # Suppress nginx version in error pages
    server_tokens off;
}
